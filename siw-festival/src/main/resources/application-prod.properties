server.port=8081
server.address=127.0.0.1
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL_PROD_FESTIVAL}
spring.datasource.username=${DB_USERNAME_PROD_FESTIVAL}
spring.datasource.password=${DB_PASSWORD_PROD_FESTIVAL}

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=false
#logging.level.org.hibernate.SQL=warn
#logging.level.org.hibernate.type.descriptor.sql=warn
server.servlet.session.cookie.secure=true

spring.config.import=optional:file:.env[.properties]



spring.application.name=siw-festival
#==================================
# = Datasource
#==================================
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
spring.sql.init.mode=never
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
#==================================
#==================================
# = Thymeleaf configurations
#==================================
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
#spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
#==================================
# = Mesasage configurations
#==================================
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
#==================================
# = Upload immagini
#==================================
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#==================================
# = Google configurations
#==================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
#==================================
# = API
#==================================
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=false