<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <header th:fragment="intestazione" class="navbar" xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <div class="navbar-inner">
            <a class="brand" th:href="@{/}">SiwFestival</a>
            <nav class="nav-links">
                <a th:href="@{/festival}">Festival</a>
                <a th:href="@{/film}">Film</a>
                <a th:href="@{/admin/sale}" sec:authorize="hasAuthority('ADMIN')">Sale</a>
                <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Accedi</a>
                <span class="badge badge-violet" sec:authorize="isAuthenticated()"
                    sec:authentication="name">utente</span>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                    <button type="submit" class="btn btn-ghost btn-sm">Esci</button>
                </form>
            </nav>
        </div>
    </header>

    <footer th:fragment="footer" class="footer">
        <p>SiwFestival · Sistemi Informativi su Web</p>
    </footer>

    <main th:fragment="errorBox(codice, titolo, messaggio)" class="error-page">
    <!-- <p class="error-code" th:text="${codice}">404</p> -->
    <p class="error-code" th:text="${codice} ?: 'Oops'">404</p>
    <h1 class="error-title" th:text="${titolo}">Pagina non trovata</h1>
    <p class="error-text" th:text="${errorMessage} ?: ${messaggio}">Messaggio</p>
    <div class="error-actions">
        <a class="btn" th:href="@{/}">Torna alla home</a>
        <a class="btn btn-ghost" href="javascript:history.back().back">Indietro</a>
    </div>
</main>
</body>

</html>
