<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Dettaglio Attore - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />

    <header th:replace="~{fragments/base.html :: intestazione}"></header>

    <main class="container">

        <!-- INFORMAZIONI PRINCIPALI -->
        
            <div class="show-info">
                <h1 th:text="${attore.nome} + ' ' + ${attore.cognome}">Nome Cognome</h1>

                <dl class="meta-list">
                    <dt>Anno di uscita</dt>
                    <dd th:text="${attore.dataNascita}">12-21-21</dd>
                    <dt>Nazionalità</dt>
                    <dd th:text="${attore.nazionalità}">Nazionalità</dd>
                </dl>

                <div class="show-actions">
                    <a th:href="@{'/admin/attore/' + ${attore.id} + '/edit'}" class="btn btn-secondary"
                        sec:authorize="hasAuthority('ADMIN')">Modifica attore</a>
                    <a th:href="@{/}" class="btn btn-ghost">Torna alla home</a>
                </div>
            </div>
