<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestione Sale - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>

<body>
    <header th:replace="~{fragments/base.html :: intestazione}"></header>

    <main class="container">

        <!-- ELENCO SALE -->
        <section class="section">
            <h2 class="section-title">Gestione Sale</h2>

            <div class="empty" th:if="${sale == null or sale.isEmpty()}">
                Nessuna sala presente.
            </div>

            <div class="table-wrap" th:unless="${sale == null or sale.isEmpty()}">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Indirizzo</th>
                            <th>Capienza</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${sale}">
                            <td th:text="${s.nome}">Nome</td>
                            <td th:text="${s.indirizzo}">Indirizzo</td>
                            <td th:text="${s.capienza}">100</td>
                            <td>
                                <a class="btn btn-secondary" th:href="@{'/admin/sala/' + ${s.id} + '/edit'}">Modifica</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- NUOVA SALA -->
        <section class="section">
            <h2 class="section-title">Nuova sala</h2>

            <form th:action="@{/admin/sale}" method="POST" th:object="${nuovaSala}" class="form">

                <div class="form-group">
                    <label class="form-label" for="nome">Nome sala</label>
                    <input type="text" id="nome" th:field="*{nome}" class="input-field" required />
                    <span class="error-text" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="indirizzo">Indirizzo</label>
                    <input type="text" id="indirizzo" th:field="*{indirizzo}" class="input-field" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="capienza">Capienza</label>
                    <input type="number" id="capienza" th:field="*{capienza}" class="input-field" required min="1" />
                    <span class="error-text" th:if="${#fields.hasErrors('capienza')}" th:errors="*{capienza}"></span>
                </div>

                <div class="show-actions">
                    <button type="submit" class="btn btn-primary">Salva sala</button>
                    <a th:href="@{/}" class="btn btn-ghost">Torna alla home</a>
                </div>
            </form>
        </section>
    </main>

    <footer th:replace="~{fragments/base.html :: footer}"></footer>
</body>

</html>
