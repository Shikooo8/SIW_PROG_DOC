<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestione Sale - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="icon" type="image/png" th:href="@{/SF.png}">
</head>

<body>
    <header th:replace="~{fragments/base.html :: intestazione}"></header>

    <main class="container">
        <section class="section">
            <h2 class="section-title">Gestione Sale</h2>

            <div class="show-actions">
                <a class="btn btn-primary" th:href="@{/admin/sala/new}">Aggiungi nuova sala</a>
            </div>

            <div class="alert alert-error" th:if="${errore}" th:text="${errore}">Errore</div>

            <div class="empty" th:if="${sale == null or sale.isEmpty()}">
                Nessuna sala presente.
            </div>

            <div class="table-wrap" th:unless="${sale == null or sale.isEmpty()}">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Indirizzo</th>
                            <th>Capienza</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${sale}">
                            <td th:text="${s.nome}">Nome</td>
                            <td th:text="${s.indirizzo}">Indirizzo</td>
                            <td th:text="${s.capienza}">100</td>
                            <td>
                                <div class="show-actions">
                                    <a class="btn btn-secondary"
                                       th:href="@{/admin/sala/{id}/edit(id=${s.id})}">Modifica</a>

                                    <form th:action="@{/admin/sala/{id}/delete(id=${s.id})}" method="POST"
                                          style="display:inline"
                                          onsubmit="return confirm('Sei sicuro di voler eliminare questa sala?');">
                                        <button type="submit" class="btn btn-danger">Elimina</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/base.html :: footer}"></footer>
</body>

</html>
