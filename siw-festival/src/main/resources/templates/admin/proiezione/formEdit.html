<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Modifica Proiezione - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="icon" type="image/png" th:href="@{/SF.png}">
</head>

<body>
    <header th:replace="~{fragments/base.html :: intestazione}"></header>

    <main class="container">
        <div class="form-card">
            <h1>Modifica la proiezione</h1>

            <form th:action="@{'/admin/proiezione/' + ${proiezione.id} + '/edit'}" method="post"
                th:object="${proiezione}">

                <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore</p>
                </div>

                <!-- il festival non cambia: lo teniamo nascosto per non perderlo -->
                <input type="hidden" th:field="*{festival}" />

                <div class="form-group">
                    <label for="film">Film</label>
                    <select id="film" th:field="*{film}" required>
                        <option th:each="f : ${films}" th:value="${f.id}" th:text="${f.titolo}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('film')}" th:errors="*{film}"></span>
                </div>

                <div class="form-group">
                    <label for="sala">Sala</label>
                    <select id="sala" th:field="*{sala}" required>
                        <option th:each="s : ${sale}" th:value="${s.id}" th:text="${s.nome}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('sala')}" th:errors="*{sala}"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="data">Data</label>
                        <input type="date" th:field="*{data}" class="input-field" required />
                        <span class="field-error" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></span>
                    </div>
                    <div class="form-group">
                        <label for="ora">Ora</label>
                        <input type="time" id="ora" th:field="*{ora}" required />
                        <span class="field-error" th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="stato">Stato</label>
                    <select id="stato" th:field="*{stato}" required>
                        <option th:each="statoOpt : ${T(it.uniroma3.siw_festival.model.StatoProiezione).values()}"
                            th:value="${statoOpt}" th:text="${statoOpt}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('stato')}" th:errors="*{stato}"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Aggiorna proiezione</button>
                    <a th:href="@{'/festival/' + ${proiezione.festival.id}}" class="btn btn-ghost">Annulla</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/base.html :: footer}"></footer>
</body>

</html>
