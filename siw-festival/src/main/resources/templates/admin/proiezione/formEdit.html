<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifica Proiezione - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
            <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">

</head>
<body>
    <header>
        <h1>Modifica Proiezione</h1>
        <!-- Usa l'id del festival salvato nella proiezione per il tasto "annulla" -->
        <p><a th:href="@{'/festival/' + ${proiezione.festival.id}}" style="color: white; text-decoration: underline;">Annulla e torna al festival</a></p>
    </header>

    <div class="nav-container">
        <!-- L'action punta all'endpoint di modifica, passando l'ID della proiezione -->
        <form th:action="@{'/admin/proiezione/' + ${proiezione.id} + '/edit'}" method="POST" th:object="${proiezione}" class="form-box">
            
            <div th:if="${#fields.hasGlobalErrors()}" class="global-error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <!-- Mantieni nascosto l'ID del festival per non perderlo nell'oggetto inviato al server -->
            <input type="hidden" th:field="*{festival}" />

            <div class="form-group">
                <label class="form-label">Film:</label>
                <select th:field="*{film}" class="input-field" required>
                    <option th:each="f : ${films}" th:value="${f.id}" th:text="${f.titolo}"></option>
                </select>
                <span th:if="${#fields.hasErrors('film')}" th:errors="*{film}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Sala:</label>
                <select th:field="*{sala}" class="input-field" required>
                    <option th:each="s : ${sale}" th:value="${s.id}" th:text="${s.nome}"></option>
                </select>
                <span th:if="${#fields.hasErrors('sala')}" th:errors="*{sala}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Data:</label>
                <input type="date" th:field="*{data}" class="input-field" required/>
                <span th:if="${#fields.hasErrors('data')}" th:errors="*{data}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Ora:</label>
                <input type="time" th:field="*{ora}" class="input-field" required/>
                <span th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Stato Proiezione:</label>
                <select th:field="*{stato}" class="input-field" required>
                    <option th:each="statoOpt : ${T(it.uniroma3.siw_festival.model.StatoProiezione).values()}" 
                            th:value="${statoOpt}" 
                            th:text="${statoOpt}"></option>
                </select>
                <span th:if="${#fields.hasErrors('stato')}" th:errors="*{stato}" class="error-text"></span>
            </div>

            <button type="submit" class="nav-button">Aggiorna Proiezione</button>
        </form>
    </div>
</body>
</html>
