<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Programma Proiezione - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="icon" type="image/png" th:href="@{/SF.png}">
</head>

<body>
    <header th:replace="~{fragments/base.html :: intestazione}"></header>

    <main class="container">
        <div class="form-card">
            <h1>Programma una proiezione</h1>

            <div class="alert alert-info" th:if="${films.isEmpty()}">
                Questo festival non ha ancora film partecipanti.
                <a th:href="@{'/admin/festival/' + ${festivalId} + '/edit'}">Aggiungili al festival</a> e poi torna qui.
            </div>

            <form th:unless="${films.isEmpty()}" th:action="@{'/admin/festival/' + ${festivalId} + '/proiezione/new'}"
                method="post" th:object="${proiezione}">

                <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore</p>
                </div>

                <div class="form-group">
                    <label for="film">Film</label>
                    <select id="film" th:field="*{film}" required>
                        <option value="">-- Seleziona il film --</option>
                        <option th:each="f : ${films}" th:value="${f.id}" th:text="${f.titolo}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('film')}" th:errors="*{film}"></span>
                </div>

                <div class="form-group">
                    <label for="salaCerca">Sala</label>

                    <div class="picker">
                        <input type="text" id="salaCerca" placeholder="Cerca o scegli la sala..." autocomplete="off">
                        <ul class="picker-list" id="salaList" hidden>
                            <li th:each="s : ${sale}" th:attr="data-id=${s.id}" th:text="${s.nome}"></li>
                            <li class="picker-empty" id="salaVuota" hidden>Nessuna sala trovata</li>
                        </ul>
                    </div>

                    <!-- il select vero: nascosto, è lui che viene inviato -->
                    <select id="sala" th:field="*{sala}" hidden>
                        <option value="">-- Seleziona la sala --</option>
                        <option th:each="s : ${sale}" th:value="${s.id}" th:text="${s.nome}"></option>
                    </select>

                    <span class="field-error" th:if="${#fields.hasErrors('sala')}" th:errors="*{sala}"></span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="data">Data</label>
                        <input type="date" id="data" th:field="*{data}" required />
                        <span class="field-error" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></span>
                    </div>
                    <div class="form-group">
                        <label for="ora">Ora</label>
                        <input type="time" id="ora" th:field="*{ora}" required />
                        <span class="field-error" th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="stato">Stato</label>
                    <select id="stato" th:field="*{stato}" required>
                        <option th:each="statoOpt : ${T(it.uniroma3.siw_festival.model.StatoProiezione).values()}"
                            th:value="${statoOpt}" th:text="${statoOpt}">SCHEDULED</option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('stato')}" th:errors="*{stato}"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salva proiezione</button>
                    <a th:href="@{'/festival/' + ${festivalId}}" class="btn btn-ghost">Annulla</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/base.html :: footer}"></footer>
    <dialog id="erroreDialog" th:if="${erroreSovrapposizione}">
        <h3>Impossibile salvare la proiezione</h3>
        <p th:text="${erroreSovrapposizione}">Sala occupata...</p>
        <form method="dialog">
            <button type="submit">Chiudi</button>
        </form>
    </dialog>

    <script th:if="${erroreSovrapposizione}">
        document.getElementById('erroreDialog').showModal();
    </script>
    <script>
        const select = document.getElementById('sala');
        const cerca = document.getElementById('salaCerca');
        const lista = document.getElementById('salaList');
        const vuota = document.getElementById('salaVuota');
        const voci = lista.querySelectorAll('li[data-id]');

        // in modifica (o dopo un errore) mostra la sala già scelta
        if (select.value) {
            cerca.value = select.options[select.selectedIndex].text;
        }

        function filtra() {
            const testo = cerca.value.toLowerCase();
            let visibili = 0;
            voci.forEach(li => {
                const ok = li.textContent.toLowerCase().includes(testo);
                li.hidden = !ok;
                if (ok) visibili++;
            });
            vuota.hidden = visibili > 0;
        }

        cerca.addEventListener('focus', () => { cerca.select(); filtra(); lista.hidden = false; });
        cerca.addEventListener('input', () => {
            select.value = '';          // se riscrivo, la scelta precedente non vale più
            filtra();
            lista.hidden = false;
        });

        voci.forEach(li => {
            li.addEventListener('click', () => {
                select.value = li.dataset.id;
                cerca.value = li.textContent;
                lista.hidden = true;
            });
        });

        // click fuori dal selettore: chiude la lista
        document.addEventListener('click', e => {
            if (!e.target.closest('.picker')) lista.hidden = true;
        });
    </script>
</body>

</html>
