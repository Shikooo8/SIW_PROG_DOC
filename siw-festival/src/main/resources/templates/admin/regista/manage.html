<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestione Registi</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div class="nav-container" style="flex-direction: column; align-items: center;">
        <h2>Gestione Registi</h2>
        
        <!-- Elenco dei registi -->
        <table border="1" style="width: 80%; margin-bottom: 30px; text-align: center;">
            <tr>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Azioni</th>
            </tr>
            <tr th:each="r : ${registi}">
                <td th:text="${r.nome}">Nome</td>
                <td th:text="${r.cognome}">Cognome</td>
                <td>
                    <!-- Link alle operazioni -->
                    <a th:href="@{'/admin/registi/' + ${r.id} + '/edit'}">Modifica</a> 
                </td>
            </tr>
        </table>

        <!-- Box Nuovo Regista -->
        <div class="form-box" style="border:1px solid #eee; padding:20px; width: 60%;">
            <h3 style="margin-top:0;">Nuovo Regista</h3>
            <form th:action="@{/admin/registi}" method="POST" th:object="${nuovoRegista}">
                
                <label class="form-label">Nome:</label>
                <input type="text" th:field="*{nome}" class="input-field" required/>

                <label class="form-label">Cognome:</label>
                <input type="text" th:field="*{cognome}" class="input-field" required/>

                <label class="form-label">Data di nascita:</label>
                <input type="date" th:field="*{dataNascita}" class="input-field"/>

                <label class="form-label">Nazionalità:</label>
                <input type="text" th:field="*{nazionalità}" class="input-field"/>

                <button type="submit" class="nav-button" style="margin-top: 10px;">Salva Regista</button>
            </form>
        </div>
    </div>
</body>
</html>
