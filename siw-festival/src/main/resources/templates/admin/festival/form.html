<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Festival - Gestione</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="icon" type="image/png" th:href="@{/SF.png}">
</head>
<body>
    <header th:replace="~{fragments/base.html :: intestazione}"></header>

    <main class="container">
        <div class="form-card">
            <!-- condizione ? testo se vera : testo se falsa -->
            <h1 th:text="${festival.id == null} ? 'Aggiungi un festival' : 'Modifica il festival'">Festival</h1>

            <form th:action="@{/admin/festival}" method="post" th:object="${festival}" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}" />

                <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore</p>
                </div>

                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}" />
                    <span class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="anno">Anno</label>
                        <input type="number" id="anno" th:field="*{anno}" />
                        <span class="field-error" th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}"></span>
                    </div>
                    <div class="form-group">
                        <label for="citta">Città</label>
                        <input type="text" id="citta" th:field="*{città}" />
                        <span class="field-error" th:if="${#fields.hasErrors('città')}" th:errors="*{città}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dataInizio">Data inizio</label>
                        <input type="date" id="dataInizio" th:field="*{dataInizio}" />
                    </div>
                    <div class="form-group">
                        <label for="dataFine">Data fine</label>
                        <input type="date" id="dataFine" th:field="*{dataFine}" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="descrizione">Descrizione</label>
                    <textarea id="descrizione" rows="4" th:field="*{descrizione}"></textarea>
                </div>

                <!-- IMMAGINE -->
                <div class="form-group">
                    <label>Immagine</label>
                    <div class="file-input">
                        <input type="file" id="file" name="file" accept="image/png, image/jpeg, image/webp" hidden />
                        <label for="file" class="btn btn-secondary btn-sm">Scegli file</label>
                        <span class="file-nome">Nessun file selezionato</span>
                    </div>
                    <span class="form-hint" th:if="${festival.id != null}">
                        Se non scegli nessun file, resta l'immagine attuale.
                    </span>
                </div>

                <!-- FILM PARTECIPANTI -->
                <h2 class="section-title">Film partecipanti</h2>
                <div class="form-group picker" th:data-url="@{/admin/ricerca/film}"
                     data-multiple="true" data-name="filmIds">
                    <div class="picker-selected">
                        <span class="badge" th:each="f : ${filmSelezionati}">
                            <span th:text="${f.titolo + ' (' + f.anno + ')'}">Film</span>
                            <button type="button" class="chip-x" title="Togli">×</button>
                            <input type="hidden" name="filmIds" th:value="${f.id}" />
                        </span>
                    </div>
                    <input type="text" class="picker-search" placeholder="Cerca un film..." autocomplete="off" />
                    <ul class="picker-list" hidden></ul>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salva festival</button>
                    <a th:href="@{/festival}" class="btn btn-ghost">Annulla</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/base.html :: footer}"></footer>

    <script th:src="@{/js/picker.js}"></script>
</body>
</html>
