<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuovo Festival - Gestione</title>
    <link rel="stylesheet" th:href="@{/css/style.css?version=4}" />
            <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">

</head>
<body>
    <header>
        <h1>Aggiungi un nuovo Festival</h1>
        <p><a th:href="@{/festival}" class="header-link">Annulla e torna all'elenco</a></p>
    </header>

    <div class="nav-container">
        <form th:action="@{/admin/festival/new}" method="POST" th:object="${festival}" class="form-box">
            <div th:if="${#fields.hasGlobalErrors()}" class="global-error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore generico</p>
            </div>

            <!-- I campi standard -->
            <div class="form-group"><label class="form-label">Nome:</label><input type="text" th:field="*{nome}" class="input-field" /><span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-text"></span></div>
            <div class="form-group"><label class="form-label">Anno:</label><input type="number" th:field="*{anno}" class="input-field" /><span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}" class="error-text"></span></div>
            <div class="form-group"><label class="form-label">Città:</label><input type="text" th:field="*{città}" class="input-field" /><span th:if="${#fields.hasErrors('città')}" th:errors="*{città}" class="error-text"></span></div>
            <div class="form-group"><label class="form-label">Data inizio:</label><input type="date" th:field="*{dataInizio}" class="input-field" /></div>
            <div class="form-group"><label class="form-label">Data fine:</label><input type="date" th:field="*{dataFine}" class="input-field" /></div>
            <div class="form-group"><label class="form-label">Descrizione:</label><textarea th:field="*{descrizione}" class="input-field" rows="4"></textarea></div>

            <hr style="width: 100%; border: 0; border-top: 1px solid #eee;" />

            

            <button type="submit" class="nav-button">Salva Festival</button>
        </form>
    </div>
</body>
</html>
