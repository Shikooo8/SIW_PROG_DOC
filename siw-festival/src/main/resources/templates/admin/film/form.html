<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Film - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>

<body>
    <header th:replace="~{fragments/base.html :: intestazione}"></header>

    <main class="container">
        <div class="form-card">
            <h1 th:text="${film.id == null} ? 'Aggiungi un film' : 'Modifica il film'">Film</h1>

            <form th:action="@{/admin/film}" method="post" th:object="${film}">
                <!-- bottone di default: Invio nei campi di testo salva, invece di premere "Rimuovi" -->
                <button type="submit" hidden aria-hidden="true" tabindex="-1">Prova</button>
                <input type="hidden" th:field="*{id}" />

                <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore</p>
                </div>

                <div class="form-group">
                    <label for="titolo">Titolo</label>
                    <input type="text" id="titolo" th:field="*{titolo}" />
                    <span class="field-error" th:if="${#fields.hasErrors('titolo')}" th:errors="*{titolo}"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="anno">Anno</label>
                        <input type="number" id="anno" th:field="*{anno}" />
                        <span class="field-error" th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}"></span>
                    </div>
                    <div class="form-group">
                        <label for="durata">Durata (minuti)</label>
                        <input type="number" id="durata" th:field="*{durata}" />
                        <span class="field-error" th:if="${#fields.hasErrors('durata')}" th:errors="*{durata}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="genere">Genere</label>
                        <input type="text" id="genere" th:field="*{genere}" />
                    </div>
                    <div class="form-group">
                        <label for="paeseProduzione">Paese di produzione</label>
                        <input type="text" id="paeseProduzione" th:field="*{paeseProduzione}" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="regista">Regista</label>
                    <input type="text" id="regista" th:field="*{regista}" />
                    <span class="field-error" th:if="${#fields.hasErrors('regista')}" th:errors="*{regista}"></span>
                </div>

                <!-- FESTIVAL -->
                <h2 class="section-title">Festival</h2>
                <div class="form-group">
                    <div class="empty" th:if="${festivals.isEmpty()}">Nessun festival nel sistema.</div>
                    <div th:each="f : ${festivals}">
                        <label>
                            <input type="checkbox" th:field="*{festivalIds}" th:value="${f.id}" />
                            <span th:text="${f.nome}">Festival</span>
                        </label>
                    </div>
                </div>

                <!-- CAST -->
                <h2 class="section-title">Cast</h2>
                <div class="empty" th:if="${#lists.isEmpty(film.cast)}">
                    Nessun personaggio: aggiungine uno.
                </div>

                <div class="review-list">
                    <div class="review" th:each="riga, iter : *{cast}">
                        <div class="review-head">
                            <span class="review-author" th:text="'Personaggio ' + ${iter.count}">Personaggio 1</span>
                            <button type="submit" th:formaction="@{'/admin/film/cast/' + ${iter.index} + '/remove'}"
                                class="btn btn-danger btn-sm" formnovalidate>Rimuovi</button>
                        </div>

                        <input type="hidden" th:field="*{cast[__${iter.index}__].id}" />

                        <div class="form-group">
                            <label th:attr="for=${'cast' + iter.index + '.personaggio'}">Nome del personaggio</label>
                            <input type="text" th:field="*{cast[__${iter.index}__].personaggio}" />
                            <span class="field-error"
                                th:if="${#fields.hasErrors('cast[__${iter.index}__].personaggio')}"
                                th:errors="*{cast[__${iter.index}__].personaggio}"></span>
                        </div>

                        <div class="form-group">
                            <label th:attr="for=${'cast' + iter.index + '.attoreId'}">Attore</label>
                            <select th:field="*{cast[__${iter.index}__].attoreId}">
                                <option value="">Nuovo attore (compila i campi qui sotto)</option>
                                <option th:each="a : ${attori}" th:value="${a.id}"
                                    th:text="${a.nome + ' ' + a.cognome}">Nome Cognome</option>
                            </select>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label th:attr="for=${'cast' + iter.index + '.nome'}">Nome</label>
                                <input type="text" th:field="*{cast[__${iter.index}__].nome}" />
                            </div>
                            <div class="form-group">
                                <label th:attr="for=${'cast' + iter.index + '.cognome'}">Cognome</label>
                                <input type="text" th:field="*{cast[__${iter.index}__].cognome}" />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label th:attr="for=${'cast' + iter.index + '.dataNascita'}">Data di nascita</label>
                                <input type="date" th:field="*{cast[__${iter.index}__].dataNascita}" />
                            </div>
                            <div class="form-group">
                                <label th:attr="for=${'cast' + iter.index + '.nazionalita'}">Nazionalità</label>
                                <input type="text" th:field="*{cast[__${iter.index}__].nazionalita}" />
                            </div>
                        </div>
                        <span class="form-hint">Nome, cognome e gli altri dati servono solo se non scegli un attore
                            dall'elenco.</span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" th:formaction="@{/admin/film/cast/add}" class="btn btn-secondary"
                        formnovalidate>Aggiungi personaggio</button>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salva film</button>
                    <a th:href="@{/film}" class="btn btn-ghost">Annulla</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/base.html :: footer}"></footer>
</body>

</html>
