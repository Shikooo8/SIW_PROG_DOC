<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Recensioni - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/style.css?version=3}" />
</head>

<body>
    <header>
        <h1 th:text="'Recensioni: ' + ${film.titolo}">Recensioni</h1>
        <p><a th:href="@{'/film/' + ${film.id}}" style="color: white; text-decoration: underline;">Torna al film</a></p>
    </header>

    <div class="nav-container" style="flex-direction: column; align-items: center;">
        <div style="background-color: white; padding: 30px; border-radius: 8px; width: 60%; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            <div id="recensioni-root" th:attr="data-film-id=${film.id}"></div>
        </div>
    </div>

    <!-- script type="module" th:src="@{/react/recensioni.js}"></script -->
</body>

</html>
