<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Elenco Film - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="icon" type="image/png" th:href="@{/SF.png}">
</head>

<body>
    <header th:replace="~{fragments/base.html :: intestazione}"></header>

    <main class="container">
        <div class="page-header">
            <div>
                <h1>Film</h1>
                <p class="page-subtitle">Film trovati: <span th:text="${filmsNumber}">0</span></p>
            </div>
            <a th:href="@{/admin/film/new}" class="btn btn-primary" sec:authorize="hasAuthority('ADMIN')">Aggiungi un
                film</a>
        </div>

        <!-- BARRA DI RICERCA -->
        <form class="search-bar" th:action="@{/film}" method="get">
            <input type="text" name="q" th:value="${q}" placeholder="Cerca un film per titolo..." autocomplete="off" />
            <button type="submit" class="btn btn-primary">Cerca</button>
            <a th:unless="${q.isEmpty()}" th:href="@{/film}" class="btn btn-ghost">Azzera</a>
        </form>

        <div class="empty" th:if="${films.isEmpty()}">
            <span th:if="${q.isEmpty()}">Non ci sono film nel sistema.</span>
            <span th:unless="${q.isEmpty()}">Nessun film trovato per "<span th:text="${q}">testo</span>".</span>
        </div>

        <div class="grid" th:unless="${films.isEmpty()}">
            <article class="card" th:each="film : ${films}">
                <div class="card-media">
                    <img th:src="${film.immagine != null} ? @{/uploads/{p}(p=${film.immagine})} : @{/images/placeholder.jpg}"
                        th:alt="${film.titolo}" />
                </div>
                <div class="card-body">
                    <h3 class="card-title">
                        <a th:href="@{'/film/' + ${film.id}}" th:text="${film.titolo}">Titolo Film</a>
                    </h3>
                    <p class="card-meta">
                        <span th:if="${film.regista != null}" th:text="${film.regista} + ' · '">Regista · </span><span
                            th:text="${film.anno}">2010</span>
                    </p>
                    <div class="card-tags">
                        <span class="badge" th:if="${film.genere != null}" th:text="${film.genere}">Genere</span>
                    </div>
                </div>
            </article>
        </div>

        <!-- PAGINE: 1 2 3 ... (solo se ce n'è più di una) -->
        <nav class="pagination" th:if="${pagina.totalPages > 1}">
            <a th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}" th:href="@{/film(q=${q}, page=${i})}"
                th:text="${i + 1}" th:classappend="${i == pagina.number} ? 'btn-primary' : 'btn-secondary'"
                class="btn btn-sm">1</a>
        </nav>
    </main>
    <footer th:replace="~{fragments/base.html :: footer}"></footer>
</body>

</html>
