<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuovo Film - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/style.css?version=4}" />
</head>
<body>
    <header>
        <h1>Aggiungi un nuovo Film</h1>
        <p><a th:href="@{/film}" class="header-link">Annulla e torna all'elenco</a></p>
    </header>

    <div class="nav-container">
        
        
        <!-- form con l'azione del controller, metodo, oggetto creato  e  ??? -->
        <form th:action="@{/film}" method="POST" th:object="${film}" class="form-box">
            
            <div th:if="${#fields.hasGlobalErrors()}" class="global-error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore generico</p>
            </div>

            <!-- Dati del Film -->
            <div class="form-group">
                <label class="form-label">Titolo:</label>
            
                <!-- AGGIUNGO UN CAMPO E FACCIO IL CONTROLLO DI VALIDITÀ-->
                <input type="text" th:field="*{titolo}" class="input-field"/>
                <span th:if="${#fields.hasErrors('titolo')}" th:errors="*{titolo}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Anno:</label>
                <input type="number" th:field="*{anno}" class="input-field"/>
                <span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}" class="error-text"></span>
            </div>

            <hr style="width: 100%; border: 0; border-top: 1px solid #eee;" />

            <!-- Creazione Nuovo Regista -->
            <!-- E SE IL REGISTA FOSSE GIÀ PRESENTE????????-->
            



            <h3 style="margin-bottom: 0;">Nuovo Regista</h3>
            
            <div class="form-group">
                <label class="form-label">Nome Regista:</label>
                <!-- Accediamo all'attributo 'nome' dell'oggetto regista innestato -->
                <input type="text" th:field="*{regista.nome}" class="input-field" required/>
            </div>

            <div class="form-group">
                <label class="form-label">Cognome Regista:</label>
                <!-- Accediamo all'attributo 'cognome' dell'oggetto regista innestato -->
                <input type="text" th:field="*{regista.cognome}" class="input-field" required/>
            </div>

            <hr style="width: 100%; border: 0; border-top: 1px solid #eee;" />

            <!-- Selezione Festival -->
            <div class="form-group">
                <label class="form-label">Assegna a un Festival:</label>
                <!-- NOTA: se nel tuo modello Film hai 'private List<Festival> festivals;', 
                     sostituisci *{festival} con *{festivals} -->
                <select th:field="*{festivals}" class="input-field">
                    <option value="">-- Seleziona un Festival (Opzionale) --</option>
                    <option th:each="f : ${festivals}" th:value="${f.id}" th:text="${f.nome}"></option>
                </select>
            </div>

            <button type="submit" class="nav-button">Salva Film e Regista</button>
        </form>

    </div>
</body>
</html>
