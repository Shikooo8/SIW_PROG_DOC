<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="icon" type="image/png" th:href="@{/SF.png}">
</head>

<body>
    <header th:replace="~{fragments/base.html :: intestazione}"></header>

    <main class="container">
        <div class="form-card">
            <h1>Accedi</h1>

            <div class="alert alert-error" th:if="${param.error}">Username o password non corretti.</div>
            <div class="alert alert-success" th:if="${param.registered}">Registrazione completata: ora puoi accedere.
            </div>
            <div class="alert alert-info" th:if="${param.logout}">Hai effettuato l'uscita.</div>

            <form th:action="@{/login}" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required />
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Accedi</button>
                    <a th:href="@{/}" class="btn btn-ghost">Annulla</a>
                </div>
            </form>

            <p class="form-alt">Non hai un account? <a th:href="@{/register}">Registrati</a></p>
        </div>
    </main>

    <footer th:replace="~{fragments/base.html :: footer}"></footer>
</body>

</html>
