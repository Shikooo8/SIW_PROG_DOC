<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrazione - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="icon" type="image/png" th:href="@{/SF.png}">
</head>
<body>
    <header th:replace="~{fragments/base.html :: intestazione}"></header>

    <main class="container">
        <div class="form-card">
            <h1>Registrati</h1>

            <form th:action="@{/register}" method="POST" th:object="${utente}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" autocomplete="username" />
                    <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" autocomplete="new-password" />
                    <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Registrati</button>
                    <a th:href="@{/}" class="btn btn-ghost">Annulla</a>
                </div>
            </form>

            <p class="form-alt">Hai già un account? <a th:href="@{/login}">Accedi</a></p>
        </div>
    </main>

    <footer th:replace="~{fragments/base.html :: footer}"></footer>
</body>
</html>
