<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Registrazione - SiwFestival</title>
        <link rel="stylesheet" th:href="@{/css/style.css?version=4}" />
</head>
<body>
    <header>
        <h1>Benvenuto! Registrati</h1>
        <p><a th:href="@{/}" class="header-link">Annulla</a></p>
    </header>
    
    <div class="nav-container">
    <form th:action="@{/register}" method="POST" th:object="${utente}" class="form-box">
        <div class="form-group">
            <label>Username:</label>
            <input type="text" th:field="*{username}" />
            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" th:field="*{password}" />
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>
        <div>
            <button type="submit" class="nav-button">Registrati</button>
        </div>
    </form>
    </div>
</body>
</html>
