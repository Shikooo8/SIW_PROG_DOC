<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuova Recensione - SiwFestival</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body>
    <header th:replace="~{fragments/base.html :: intestazione}"></header>

    <main class="container">
        <div class="form-card">
            <h1>Scrivi una recensione</h1>
            <p class="muted" th:text="${film.titolo}">Titolo Film</p>

            <form th:action="@{'/film/' + ${film.id} + '/recensione'}" method="POST" th:object="${recensioneForm}">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore</p>
                </div>

                <div class="form-group">
                    <label for="voto">Voto (1-10)</label>
                    <input type="number" min="1" max="10" id="voto" th:field="*{voto}" />
                    <span class="field-error" th:if="${#fields.hasErrors('voto')}" th:errors="*{voto}"></span>
                </div>

                <div class="form-group">
                    <label for="testo">Recensione</label>
                    <textarea rows="5" id="testo" th:field="*{testo}"></textarea>
                    <span class="field-error" th:if="${#fields.hasErrors('testo')}" th:errors="*{testo}"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Pubblica recensione</button>
                    <a th:href="@{'/film/' + ${film.id}}" class="btn btn-ghost">Annulla</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/base.html :: footer}"></footer>
</body>
</html>
